<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Support for Wake.">
  <title>Support — Wake</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #222b55 0, #0d1020 42%, #070910 100%);
      color: #f5f7ff;
    }

    main {
      width: min(760px, calc(100% - 40px));
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 70px 0;
    }

    h1 {
      font-size: clamp(2.8rem, 8vw, 5rem);
      margin-bottom: 20px;
      letter-spacing: -.04em;
    }

    p {
      color: #b8c1df;
      line-height: 1.7;
      font-size: 1.1rem;
    }

    a {
      color: #c7d0ff;
    }

    .contact {
      margin-top: 30px;
      padding: 24px;
      border: 1px solid #3b456b;
      border-radius: 16px;
      background: rgba(255,255,255,.03);
    }

    nav {
      margin-bottom: 40px;
    }

    nav a {
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main>
    <nav>
      <a href="index.html">← Wake</a>
    </nav>

    <h1>Wake Support</h1>

    <p>
      Need help with Wake, found a problem, or want to provide feedback?
      Contact us and include a short description of what happened.
    </p>

    <div class="contact">
      <strong>Email</strong>
      <p>
        <a href="mailto:wake.app.contact@gmail.com">
          wake.app.contact@gmail.com
        </a>
      </p>
    </div>

    <p>
      Wake is currently under active development for Android.
    </p>

    <p>
      <a href="privacy.html">Privacy Policy</a>
    </p>
  </main>
</body>
</html>
